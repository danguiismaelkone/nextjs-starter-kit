# Reverse proxy de production (ITEM-064) — termine le TLS et transmet à `app`
# (docker-compose.yml, réseau Docker interne, jamais exposé directement en
# dehors de ce proxy en production). Les en-têtes de sécurité applicatifs
# (CSP, X-Frame-Options, X-Content-Type-Options, Referrer-Policy) sont déjà
# posés par Next.js lui-même (next.config.ts, ITEM-055) — ne pas les dupliquer
# ici évite deux sources de vérité divergentes ; ce fichier se limite aux
# en-têtes propres à la couche transport/proxy (HSTS, qui n'a de sens qu'une
# fois le TLS terminé ici).

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Ne jamais révéler la version nginx dans les en-têtes de réponse/pages d'erreur.
  server_tokens off;

  # Redirige tout le trafic HTTP vers HTTPS.
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Certificats montés en volume (docker-compose.yml) — jamais commis dans
    # l'image/le repo. Voir nginx/README.md pour leur mise en place
    # (Let's Encrypt en production, auto-signés pour un test local).
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS : n'a de sens qu'ici (après terminaison TLS), jamais posé par
    # l'application elle-même qui ne sait pas si elle est servie derrière TLS.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 25m; # aligné sur la plus grande limite d'upload applicative (documents, ITEM-028).

    location / {
      proxy_pass http://app:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Websockets / connexions longues (HMR en dev n'est pas concerné ici,
      # mais Next.js peut ouvrir des connexions persistantes en production).
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
